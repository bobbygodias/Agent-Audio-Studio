name: Test Agent Audio Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio processing dependencies
        run: python -m pip install -r andrew-studio/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q andrew-studio/scripts andrew-studio/tests
      - name: Unit tests without user audio
        run: python -m unittest discover -s andrew-studio/tests -v
